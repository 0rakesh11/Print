name: Build PrinterShare USB APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Final Clean Project
        run: |
          rm -rf * .[^.]* 2>/dev/null || true
          cat << 'EOF' > make_project.py
          import os

          def w(p, lines):
              d = os.path.dirname(p)
              if d:
                  os.makedirs(d, exist_ok=True)
              with open(p, "w", encoding="utf-8") as f:
                  f.write("\n".join(lines) + "\n")

          w("settings.gradle", [
              "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }",
              "dependencyResolutionManagement {",
              "    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)",
              "    repositories { google(); mavenCentral() }",
              "}",
              "rootProject.name = 'PrinterShare_USB_Edition'",
              "include ':app'"
          ])

          w("build.gradle", [
              "plugins {",
              "    id 'com.android.application' version '8.2.0' apply false",
              "    id 'org.jetbrains.kotlin.android' version '1.9.20' apply false",
              "}"
          ])

          w("gradle.properties", [
              "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8",
              "android.useAndroidX=true",
              "android.nonTransitiveRClass=true"
          ])

          w("app/build.gradle", [
              "plugins {",
              "    id 'com.android.application'",
              "    id 'org.jetbrains.kotlin.android'",
              "}",
              "android {",
              "    namespace 'com.example.printershareusb'",
              "    compileSdk 34",
              "    defaultConfig {",
              "        applicationId 'com.example.printershareusb'",
              "        minSdk 24",
              "        targetSdk 34",
              "        versionCode 9",
              "        versionName '9.0'",
              "    }",
              "    compileOptions {",
              "        sourceCompatibility JavaVersion.VERSION_17",
              "        targetCompatibility JavaVersion.VERSION_17",
              "    }",
              "    kotlinOptions { jvmTarget = '17' }",
              "}",
              "dependencies {",
              "    implementation 'androidx.core:core-ktx:1.12.0'",
              "    implementation 'androidx.appcompat:appcompat:1.6.1'",
              "    implementation 'com.google.android.material:material:1.11.0'",
              "    implementation 'androidx.print:print:1.0.0'",
              "}"
          ])

          w("app/src/main/AndroidManifest.xml", [
              "<?xml version='1.0' encoding='utf-8'?>",
              "<manifest xmlns:android='http://schemas.android.com/apk/res/android'>",
              "    <uses-feature android:name='android.hardware.usb.host' android:required='true' />",
              "    <uses-permission android:name='android.permission.INTERNET' />",
              "    <uses-permission android:name='android.permission.ACCESS_NETWORK_STATE' />",
              "    <uses-permission android:name='android.permission.READ_EXTERNAL_STORAGE' android:maxSdkVersion='32' />",
              "    <uses-permission android:name='android.permission.READ_MEDIA_IMAGES' />",
              "    <application",
              "        android:allowBackup='true'",
              "        android:label='PrinterShare USB Edition'",
              "        android:icon='@drawable/ic_launcher_printer'",
              "        android:roundIcon='@drawable/ic_launcher_printer'",
              "        android:usesCleartextTraffic='true'",
              "        android:supportsRtl='true'",
              "        android:theme='@style/Theme.AppCompat.DayNight.NoActionBar'>",
              "        <activity android:name='.PrintPreviewActivity' android:exported='false' />",
              "        <activity android:name='.WebPrintActivity' android:exported='false' />",
              "        <activity android:name='.MainActivity' android:exported='true'>",
              "            <intent-filter>",
              "                <action android:name='android.intent.action.MAIN' />",
              "                <category android:name='android.intent.category.LAUNCHER' />",
              "            </intent-filter>",
              "            <intent-filter>",
              "                <action android:name='android.hardware.usb.action.USB_DEVICE_ATTACHED' />",
              "            </intent-filter>",
              "            <meta-data android:name='android.hardware.usb.action.USB_DEVICE_ATTACHED' android:resource='@xml/usb_device_filter' />",
              "        </activity>",
              "    </application>",
              "</manifest>"
          ])

          w("app/src/main/res/xml/usb_device_filter.xml", [
              "<?xml version='1.0' encoding='utf-8'?>",
              "<resources>",
              "    <usb-device class='7' />",
              "    <usb-device vendor-id='1008' />",
              "</resources>"
          ])

          w("app/src/main/res/drawable/ic_launcher_printer.xml", [
              "<vector xmlns:android='http://schemas.android.com/apk/res/android' android:width='108dp' android:height='108dp' android:viewportWidth='108' android:viewportHeight='108'>",
              "    <path android:fillColor='#0288D1' android:pathData='M0,0h108v108h-108z'/>",
              "    <path android:fillColor='#01579B' android:pathData='M14,14h80v80h-80z'/>",
              "    <path android:fillColor='#FFFFFF' android:pathData='M74,42H34c-4.4,0 -8,3.6 -8,8v18h10v14h36V68h10V50C82,45.6 78.4,42 74,42zM66,76H42V60h24V76zM74,53c-1.7,0 -3,-1.3 -3,-3s1.3,-3 3,-3s3,1.3 3,3S75.7,53 74,53zM70,26H38v12h32V26z'/>",
              "</vector>"
          ])

          w("app/src/main/java/com/example/printershareusb/ThemePrefs.kt", [
              "package com.example.printershareusb",
              "import android.content.Context",
              "import android.graphics.*",
              "import android.graphics.drawable.GradientDrawable",
              "",
              "object ThemePrefs {",
              "    fun isDark(ctx: Context): Boolean = ctx.getSharedPreferences(\"ui_prefs\", Context.MODE_PRIVATE).getBoolean(\"dark\", true)",
              "    fun toggle(ctx: Context) {",
              "        val cur = isDark(ctx)",
              "        ctx.getSharedPreferences(\"ui_prefs\", Context.MODE_PRIVATE).edit().putBoolean(\"dark\", !cur).apply()",
              "    }",
              "    fun bgColor(ctx: Context) = if (isDark(ctx)) Color.parseColor(\"#0B0F19\") else Color.parseColor(\"#F1F5F9\")",
              "    fun cardColor(ctx: Context) = if (isDark(ctx)) Color.parseColor(\"#161F30\") else Color.parseColor(\"#FFFFFF\")",
              "    fun barColor(ctx: Context) = if (isDark(ctx)) Color.parseColor(\"#111827\") else Color.parseColor(\"#E2E8F0\")",
              "    fun textColor(ctx: Context) = if (isDark(ctx)) Color.parseColor(\"#F8FAFC\") else Color.parseColor(\"#0F172A\")",
              "    fun subTextColor(ctx: Context) = if (isDark(ctx)) Color.parseColor(\"#94A3B8\") else Color.parseColor(\"#475569\")",
              "    fun accentColor() = Color.parseColor(\"#0288D1\")",
              "",
              "    fun roundedBox(fillColor: Int, radiusPx: Float, strokeColor: Int = 0, strokeWidth: Int = 0): GradientDrawable {",
              "        return GradientDrawable().apply {",
              "            shape = GradientDrawable.RECTANGLE",
              "            cornerRadius = radiusPx",
              "            setColor(fillColor)",
              "            if (strokeWidth > 0) setStroke(strokeWidth, strokeColor)",
              "        }",
              "    }",
              "",
