              "        <LinearLayout android:id='@+id/pdfNavLayout' android:layout_width='wrap_content' android:layout_height='wrap_content' android:layout_alignParentEnd='true' android:layout_centerVertical='true' android:gravity='center_vertical' android:orientation='horizontal'>\n"
              "            <Button android:id='@+id/btnPrevPage' android:layout_width='40dp' android:layout_height='36dp' android:background='#0288D1' android:text='&lt;' android:textColor='#FFFFFF' />\n"
