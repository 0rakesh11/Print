      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK & Rename
        run: |
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk PrinterShare_USB_Edition.apk

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: PrinterShare_USB_Edition
          path: PrinterShare_USB_Edition.apk
