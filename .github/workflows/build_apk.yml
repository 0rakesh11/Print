name: Build PrinterShare USB APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Modified App Project
        run: |
          python3 - << 'EOF'
          import os

          os.makedirs("app/src/main/res/drawable", exist_ok=True)
          os.makedirs("app/src/main/res/xml", exist_ok=True)
          os.makedirs("app/src/main/res/values", exist_ok=True)
          os.makedirs("app/src/main/java/com/example/printershareusb", exist_ok=True)

          with open("settings.gradle", "w") as f:
              f.write("""pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS) repositories { google(); mavenCentral() } }
          rootProject.name = "PrinterShareUSB"
          include ':app'
          """)

          with open("build.gradle", "w") as f:
              f.write("""plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          """)

          with open("gradle.properties", "w") as f:
              f.write("org.gradle.jvmargs=-Xmx2048m\nandroid.useAndroidX=true\n")

          with open("app/build.gradle", "w") as f:
              f.write("""plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.printershareusb'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.printershareusb"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release { minifyEnabled false }
                  debug { archiveBaseName.set("PrinterShare_USB_Edition") }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.print:print:1.0.0'
          }
          """)

          with open("app/src/main/AndroidManifest.xml", "w") as f:
              f.write("""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.usb.host" android:required="true" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />

              <application
                  android:allowBackup="true"
                  android:label="PrinterShare USB Edition"
                  android:icon="@drawable/ic_app_logo"
                  android:roundIcon="@drawable/ic_app_logo"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">

                  <activity android:name=".PrintPreviewActivity" android:exported="false" />
                  <activity android:name=".WebPrintActivity" android:exported="false" />

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" />
                      </intent-filter>
                      <meta-data
                          android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"
                          android:resource="@xml/usb_device_filter" />
                  </activity>
              </application>
          </manifest>
          """)

          with open("app/src/main/res/xml/usb_device_filter.xml", "w") as f:
              f.write("""<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <usb-device class="7" />
              <usb-device vendor-id="1008" />
          </resources>
          """)

          with open("app/src/main/res/drawable/ic_app_logo.xml", "w") as f:
              f.write("""<vector xmlns:android="http://schemas.android.com/apk/res/android"
                  android:width="108dp"
                  android:height="108dp"
                  android:viewportWidth="24"
                  android:viewportHeight="24">
                <path android:fillColor="#0099CC" android:pathData="M19,8H5C3.34,8 2,9.34 2,11v6h4v4h12v-4h4v-6C22,9.34 20.66,8 19,8zM16,19H8v-5h8V19zM19,12c-0.55,0 -1,-0.45 -1,-1s0.45,-1 1,-1 1,0.45 1,1 -0.45,1 -1,1zM18,3H6v3h12V3z"/>
              </vector>
          """)

          with open("app/src/main/java/com/example/printershareusb/UsbPrinterHelper.kt", "w") as f:
              f.write("""package com.example.printershareusb
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.hardware.usb.*
          import android.os.Build
          import java.io.ByteArrayOutputStream
          import java.util.Arrays

          class UsbPrinterHelper(private val context: Context) {
              val usbManager: UsbManager = context.getSystemService(Context.USB_SERVICE) as UsbManager
              companion object {
                  const val ACTION_USB_PERMISSION = "com.example.printershareusb.USB_PERMISSION"
                  var selectedPrinterName: String = "Not selected"
                  var connectedUsbDevice: UsbDevice? = null
              }
              fun findUsbPrinter(): UsbDevice? {
                  for (device in usbManager.deviceList.values) {
                      if (device.vendorId == 1008 || device.deviceClass == UsbConstants.USB_CLASS_PRINTER) {
                          connectedUsbDevice = device
                          selectedPrinterName = device.productName ?: "HP Ink Tank 319 (USB)"
                          return device
                      }
                      for (i in 0 until device.interfaceCount) {
                          if (device.getInterface(i).interfaceClass == UsbConstants.USB_CLASS_PRINTER) {
                              connectedUsbDevice = device
                              selectedPrinterName = device.productName ?: "HP Ink Tank 319 (USB)"
                              return device
                          }
                      }
                  }
                  return null
              }
              fun requestPermission(device: UsbDevice) {
                  val flags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) PendingIntent.FLAG_MUTABLE else 0
                  val pi = PendingIntent.getBroadcast(context, 0, Intent(ACTION_USB_PERMISSION), flags)
                  usbManager.requestPermission(device, pi)
              }
              fun sendRawUsbPrintJob(bmp: Bitmap, onResult: (Boolean, String) -> Unit) {
                  val dev = connectedUsbDevice ?: findUsbPrinter()
                  if (dev == null) { onResult(false, "USB Printer connected nahi hai!"); return }
                  if (!usbManager.hasPermission(dev)) { requestPermission(dev); onResult(false, "USB Permission allow karein."); return }
                  Thread {
                      var conn: UsbDeviceConnection? = null
                      var intf: UsbInterface? = null
                      try {
                          var epOut: UsbEndpoint? = null
                          for (i in 0 until dev.interfaceCount) {
                              val itf = dev.getInterface(i)
                              for (j in 0 until itf.endpointCount) {
                                  val ep = itf.getEndpoint(j)
                                  if (ep.type == UsbConstants.USB_ENDPOINT_XFER_BULK && ep.direction == UsbConstants.USB_DIR_OUT) {
                                      intf = itf; epOut = ep; break
                                  }
                              }
                              if (epOut != null) break
                          }
                          if (intf == null || epOut == null) { onResult(false, "Endpoint nahi mila!"); return@Thread }
                          conn = usbManager.openDevice(dev)
                          conn.claimInterface(intf, true)
                          val data = encodeToPcl(bmp)
                          var offset = 0
                          while (offset < data.size) {
                              val len = minOf(16384, data.size - offset)
                              val chunk = data.copyOfRange(offset, offset + len)
                              conn.bulkTransfer(epOut, chunk, chunk.size, 8000)
                              offset += len
                          }
                          onResult(true, "Print Job Sent Successfully!")
                      } catch (e: Exception) {
                          onResult(false, "Error: ${e.message}")
                      } finally {
                          try { if (intf != null) conn?.releaseInterface(intf); conn?.close() } catch(_:Exception){}
                      }
                  }.start()
              }
              private fun encodeToPcl(bmp: Bitmap): ByteArray {
                  val out = ByteArrayOutputStream()
                  out.write("\\u001B%-12345X@PJL\\r\\n\\u001BE\\u001B*t150R\\u001B*r1A".toByteArray())
                  val w = bmp.width; val h = bmp.height
                  val rowBytes = (w + 7) / 8
                  val buf = ByteArray(rowBytes)
                  for (y in 0 until h) {
                      Arrays.fill(buf, 0.toByte())
                      for (x in 0 until w) {
                          val p = bmp.getPixel(x, y)
                          val lum = (0.299*((p shr 16) and 0xFF) + 0.587*((p shr 8) and 0xFF) + 0.114*(p and 0xFF)).toInt()
                          if (lum < 165) buf[x/8] = (buf[x/8].toInt() or (1 shl (7 - (x%8)))).toByte()
                      }
                      out.write("\\u001B*b0M\\u001B*b${rowBytes}W".toByteArray())
                      out.write(buf)
                  }
                  out.write("\\u001B*rB\\u000C\\u001BE".toByteArray())
                  return out.toByteArray()
              }
          }
          """)

          with open("app/src/main/java/com/example/printershareusb/WebPrintActivity.kt", "w") as f:
              f.write("""package com.example.printershareusb
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.os.Bundle
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Button
          import android.widget.EditText
          import androidx.appcompat.app.AppCompatActivity
          class WebPrintActivity : AppCompatActivity() {
              companion object { var capturedWebBitmap: Bitmap? = null }
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = android.widget.RelativeLayout(this)
                  val topBar = android.widget.LinearLayout(this).apply {
                      id = android.view.View.generateViewId()
                      orientation = android.widget.LinearLayout.HORIZONTAL
                      setPadding(12, 12, 12, 12)
                  }
                  val etUrl = EditText(this).apply {
                      layoutParams = android.widget.LinearLayout.LayoutParams(0, android.widget.LinearLayout.LayoutParams.MATCH_PARENT, 1f)
                      setText("https://www.wikipedia.org")
                  }
                  val btnGo = Button(this).apply {
                      layoutParams = android.widget.LinearLayout.LayoutParams(140, android.widget.LinearLayout.LayoutParams.MATCH_PARENT)
                      text = "Go"
                  }
                  topBar.addView(etUrl)
                  topBar.addView(btnGo)

                  val webView = WebView(this).apply {
                      id = android.view.View.generateViewId()
                      settings.javaScriptEnabled = true
                      webViewClient = WebViewClient()
                      loadUrl(etUrl.text.toString())
                  }
                  val webParams = android.widget.RelativeLayout.LayoutParams(android.widget.RelativeLayout.LayoutParams.MATCH_PARENT, android.widget.RelativeLayout.LayoutParams.MATCH_PARENT)
                  webParams.addRule(android.widget.RelativeLayout.BELOW, topBar.id)
                  webParams.addRule(android.widget.RelativeLayout.ABOVE, 12345)
                  webView.layoutParams = webParams

                  val btnCapture = Button(this).apply {
                      id = 12345
                      layoutParams = android.widget.RelativeLayout.LayoutParams(android.widget.RelativeLayout.LayoutParams.MATCH_PARENT, 140).apply {
                          addRule(android.widget.RelativeLayout.ALIGN_PARENT_BOTTOM)
                      }
                      text = "Open in Print Preview"
                  }

                  root.addView(topBar)
                  root.addView(webView)
                  root.addView(btnCapture)
                  setContentView(root)

                  btnGo.setOnClickListener {
                      var url = etUrl.text.toString().trim()
                      if (!url.startsWith("http")) url = "https://$url"
                      webView.loadUrl(url)
                  }
                  btnCapture.setOnClickListener {
                      val bmp = Bitmap.createBitmap(webView.width.coerceAtLeast(100), webView.height.coerceAtLeast(100), Bitmap.Config.ARGB_8888)
                      webView.draw(Canvas(bmp))
                      capturedWebBitmap = bmp
                      startActivity(Intent(this, PrintPreviewActivity::class.java).putExtra("FROM_WEB", true))
                  }
              }
          }
          """)

          with open("app/src/main/java/com/example/printershareusb/PrintPreviewActivity.kt", "w") as f:
              f.write("""package com.example.printershareusb
          import android.app.AlertDialog
          import android.graphics.*
          import android.graphics.pdf.PdfRenderer
          import android.net.Uri
          import android.os.Bundle
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.print.PrintHelper

          class PrintPreviewActivity : AppCompatActivity() {
              private var renderedBitmap: Bitmap? = null
              private val sourceBmps = mutableListOf<Bitmap>()
              private var pictureSize = "4\\"×6\\" (10×15 cm)"
              private var pictureScaling = "Crop"
              private var pictureAlign = "Center"
              private var pageMargins = "Normal"
              private var pageOrientation = "Auto"

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_print_preview)

                  val uriList = intent.getStringArrayListExtra("FILE_URIS")
                  val textContent = intent.getStringExtra("TEXT_CONTENT")

                  if (WebPrintActivity.capturedWebBitmap != null && intent.getBooleanExtra("FROM_WEB", false)) {
                      sourceBmps.add(WebPrintActivity.capturedWebBitmap!!)
                      pictureSize = "Fit to page"; pictureScaling = "Inside"
                  } else if (textContent != null) {
                      sourceBmps.add(createBmpFromText(textContent))
                      pictureSize = "Fit to page"; pictureScaling = "Inside"
                  } else if (!uriList.isNullOrEmpty()) {
                      for (u in uriList) {
                          try { contentResolver.openInputStream(Uri.parse(u))?.use { sourceBmps.add(BitmapFactory.decodeStream(it)) } } catch(_:Exception){}
                      }
                  }

                  findViewById<Button>(R.id.btnOptions).setOnClickListener { showOptionsDialog() }
                  findViewById<Button>(R.id.btnPrint).setOnClickListener {
                      renderedBitmap?.let { bmp ->
                          val helper = PrintHelper(this)
                          helper.scaleMode = PrintHelper.SCALE_MODE_FIT
                          helper.printBitmap("PrinterShare_Print", bmp)
                      }
                  }
                  renderCanvas()
              }

              private fun showOptionsDialog() {
                  val items = arrayOf("Picture Size: $pictureSize", "Picture Scaling: $pictureScaling", "Picture Align: $pictureAlign", "Page Margins: $pageMargins", "Page Orientation: $pageOrientation")
                  AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                      .setTitle("Print Options")
                      .setItems(items) { _, which ->
                          when(which) {
                              0 -> showSingle("Picture Size", arrayOf("Fit to page", "4\\"×6\\" (10×15 cm)", "5\\"×7\\" (13×18 cm)", "8\\"×10\\" (20×25 cm)"), pictureSize) { pictureSize = it; renderCanvas() }
                              1 -> showSingle("Picture Scaling", arrayOf("Crop", "Inside"), pictureScaling) { pictureScaling = it; renderCanvas() }
                              2 -> showSingle("Picture Align", arrayOf("Center", "Top Left", "Top Right", "Bottom Left", "Bottom Right"), pictureAlign) { pictureAlign = it; renderCanvas() }
                              3 -> showSingle("Page Margins", arrayOf("No (minimum allowable)", "Small", "Normal", "Large"), pageMargins) { pageMargins = it; renderCanvas() }
                              4 -> showSingle("Page Orientation", arrayOf("Auto", "Portrait", "Landscape"), pageOrientation) { pageOrientation = it; renderCanvas() }
                          }
                      }.show()
              }

              private fun showSingle(title: String, opts: Array<String>, curr: String, cb: (String) -> Unit) {
                  val idx = opts.indexOf(curr).coerceAtLeast(0)
                  AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                      .setTitle(title).setSingleChoiceItems(opts, idx) { d, w -> cb(opts[w]); d.dismiss() }.show()
              }

              private fun renderCanvas() {
                  if (sourceBmps.isEmpty()) return
                  val bmp = sourceBmps[0]
                  val isLandscape = when(pageOrientation) { "Landscape" -> true; "Portrait" -> false; else -> bmp.width > bmp.height }
                  val pW = if(isLandscape) 1650 else 1275; val pH = if(isLandscape) 1275 else 1650
                  val sheet = Bitmap.createBitmap(pW, pH, Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(sheet); canvas.drawColor(Color.WHITE)

                  val m = when(pageMargins) { "No (minimum allowable)" -> 0; "Small" -> 36; "Large" -> 135; else -> 75 }
                  val aW = pW - (m * 2); val aH = pH - (m * 2)

                  var (bW, bH) = when(pictureSize) {
                      "4\\"×6\\" (10×15 cm)" -> Pair(600, 900)
                      "5\\"×7\\" (13×18 cm)" -> Pair(750, 1050)
                      "8\\"×10\\" (20×25 cm)" -> Pair(1200, 1500)
                      else -> Pair(aW, aH)
                  }
                  bW = bW.coerceAtMost(aW); bH = bH.coerceAtMost(aH)
                  val left = m + (aW - bW) / 2; val top = m + (aH - bH) / 2
                  val rect = Rect(left, top, left + bW, top + bH)

                  val paint = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)
                  if (pictureScaling == "Crop") {
                      val scale = maxOf(bW.toFloat() / bmp.width, bH.toFloat() / bmp.height)
                      val cW = (bW / scale).toInt(); val cH = (bH / scale).toInt()
                      val cX = (bmp.width - cW) / 2; val cY = (bmp.height - cH) / 2
                      canvas.drawBitmap(bmp, Rect(cX, cY, cX + cW, cY + cH), rect, paint)
                  } else {
                      val scale = minOf(bW.toFloat() / bmp.width, bH.toFloat() / bmp.height)
                      val dW = (bmp.width * scale).toInt(); val dH = (bmp.height * scale).toInt()
                      canvas.drawBitmap(bmp, null, Rect(left + (bW - dW)/2, top + (bH - dH)/2, left + (bW - dW)/2 + dW, top + (bH - dH)/2 + dH), paint)
                  }
                  renderedBitmap = sheet
                  findViewById<ImageView>(R.id.ivPageCanvas).setImageBitmap(sheet)
              }

              private fun createBmpFromText(txt: String): Bitmap {
                  val bmp = Bitmap.createBitmap(1200, 1600, Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(bmp); canvas.drawColor(Color.WHITE)
                  val paint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.BLACK; textSize = 36f }
                  var y = 100f
                  for (line in txt.split("\\n")) { canvas.drawText(line, 60f, y, paint); y += 52f }
                  return bmp
              }
          }
          """)

          with open("app/src/main/java/com/example/printershareusb/MainActivity.kt", "w") as f:
              f.write("""package com.example.printershareusb
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.content.SharedPreferences
          import android.graphics.Color
          import android.os.Bundle
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.appcompat.app.AppCompatDelegate

          class MainActivity : AppCompatActivity() {
              private lateinit var usbHelper: UsbPrinterHelper
              private lateinit var tvStatus: TextView
              private lateinit var rootLayout: RelativeLayout
              private lateinit var prefs: SharedPreferences

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = getSharedPreferences("settings", MODE_PRIVATE)
                  val isDark = prefs.getBoolean("dark_mode", true)
                  AppCompatDelegate.setDefaultNightMode(if (isDark) AppCompatDelegate.MODE_NIGHT_YES else AppCompatDelegate.MODE_NIGHT_NO)

                  setContentView(R.layout.activity_main)
                  usbHelper = UsbPrinterHelper(this)
                  tvStatus = findViewById(R.id.tvPrinterStatus)

                  usbHelper.findUsbPrinter()?.let { tvStatus.text = UsbPrinterHelper.selectedPrinterName }

                  // Header Theme Toggle Button
                  findViewById<Button>(R.id.btnThemeToggle).setOnClickListener {
                      val current = prefs.getBoolean("dark_mode", true)
                      prefs.edit().putBoolean("dark_mode", !current).apply()
                      recreate()
                  }

                  findViewById<Button>(R.id.btnSelectPrinter).setOnClickListener {
                      val items = arrayOf("📡 Nearby WiFi", "🦷 Nearby Bluetooth", "🔌 Direct USB Connected", "📄 Print to PDF")
                      AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                          .setTitle("Select Printer")
                          .setItems(items) { _, which ->
                              if (which == 2) {
                                  val dev = usbHelper.findUsbPrinter()
                                  if (dev != null) { usbHelper.requestPermission(dev); tvStatus.text = dev.productName ?: "HP Ink Tank 319" }
                                  else { Toast.makeText(this, "USB Printer nahi mila!", Toast.LENGTH_SHORT).show() }
                              } else {
                                  UsbPrinterHelper.selectedPrinterName = items[which].substring(3).trim()
                                  tvStatus.text = UsbPrinterHelper.selectedPrinterName
                              }
                          }.show()
                  }

                  findViewById<Button>(R.id.btnPictures).setOnClickListener {
                      startActivityForResult(Intent(Intent.ACTION_GET_CONTENT).apply { type = "image/*"; putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true) }, 101)
                  }
                  findViewById<Button>(R.id.btnDocuments).setOnClickListener {
                      startActivityForResult(Intent(Intent.ACTION_GET_CONTENT).apply { type = "application/pdf" }, 102)
                  }
                  findViewById<Button>(R.id.btnWebPages).setOnClickListener {
                      startActivity(Intent(this, WebPrintActivity::class.java))
                  }

                  val infoClick = { title: String, msg: String ->
                      AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                          .setTitle(title).setMessage(msg)
                          .setPositiveButton("Proceed to Print") { _, _ ->
                              startActivity(Intent(this, PrintPreviewActivity::class.java).putExtra("TEXT_CONTENT", "$title:\\n$msg"))
                          }.setNegativeButton("Cancel", null).show()
                  }

                  findViewById<Button>(R.id.btnGmail).setOnClickListener { infoClick("Print Gmail", "Select emails to print directly via USB OTG.") }
                  findViewById<Button>(R.id.btnContacts).setOnClickListener { infoClick("Print Contacts", "Exported Address Book & Phone Directory.") }
                  findViewById<Button>(R.id.btnCalendar).setOnClickListener { infoClick("Print Calendar", "Scheduled Events & Reminders for this week.") }
                  findViewById<Button>(R.id.btnMessages).setOnClickListener { infoClick("Print Messages", "SMS threads and chat history export.") }
                  findViewById<Button>(R.id.btnCallLog).setOnClickListener { infoClick("Print Call Log", "Recent incoming, outgoing & missed calls.") }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (resultCode == RESULT_OK && data != null) {
                      val uris = ArrayList<String>()
                      if (data.clipData != null) {
                          for (i in 0 until data.clipData!!.itemCount) uris.add(data.clipData!!.getItemAt(i).uri.toString())
                      } else if (data.data != null) uris.add(data.data!!.toString())
                      if (uris.isNotEmpty()) {
                          startActivity(Intent(this, PrintPreviewActivity::class.java).putStringArrayListExtra("FILE_URIS", uris))
                      }
                  }
              }
          }
          """)

          with open("app/src/main/res/layout/activity_main.xml", "w") as f:
              f.write("""<?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="?android:attr/colorBackground">

              <RelativeLayout
                  android:id="@+id/headerBar"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:background="#0D0D0D"
                  android:paddingStart="16dp"
                  android:paddingEnd="16dp">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_centerVertical="true"
                      android:text="PrinterShare USB Edition"
                      android:textColor="#FFFFFF"
                      android:textSize="18sp"
                      android:textStyle="bold" />

                  <Button
                      android:id="@+id/btnThemeToggle"
                      android:layout_width="42dp"
                      android:layout_height="42dp"
                      android:layout_alignParentEnd="true"
                      android:layout_centerVertical="true"
                      android:background="#2C2C2C"
                      android:text="🌓"
                      android:textColor="#FFFFFF"
                      android:textSize="16sp" />
              </RelativeLayout>

              <View
                  android:id="@+id/headerDivider"
                  android:layout_width="match_parent"
                  android:layout_height="2dp"
                  android:layout_below="@id/headerBar"
                  android:background="#0099CC" />

              <ScrollView
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_above="@+id/bottomBar"
                  android:layout_below="@id/headerDivider">

                  <GridLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:columnCount="2"
                      android:padding="16dp">

