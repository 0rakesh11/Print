                      <Button android:id="@+id/btnDocuments" android:layout_width="0dp" android:layout_height="110dp" android:layout_columnWeight="1" android:layout_margin="6dp" android:background="#161616" android:text="📁\nDocuments" android:textColor="#FFFFFF" android:textAllCaps="false"/>
                      <Button android:id="@+id/btnWebPages" android:layout_width="0dp" android:layout_height="110dp" android:layout_columnWeight="1" android:layout_margin="6dp" android:background="#161616" android:text="🌐\nWeb Pages" android:textColor="#FFFFFF" android:textAllCaps="false"/>
                      <Button android:id="@+id/btnGmail" android:layout_width="0dp" android:layout_height="110dp" android:layout_columnWeight="1" android:layout_margin="6dp" android:background="#161616" android:text="✉️\nGmail" android:textColor="#FFFFFF" android:textAllCaps="false"/>
                      <Button android:id="@+id/btnContacts" android:layout_width="0dp" android:layout_height="110dp" android:layout_columnWeight="1" android:layout_margin="6dp" android:background="#161616" android:text="👤\nContacts" android:textColor="#FFFFFF" android:textAllCaps="false"/>
