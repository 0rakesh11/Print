              "            text = \"Print Preview\"",
              "            textSize = 19f",
              "            setTypeface(null, Typeface.BOLD)",
              "            setTextColor(ThemePrefs.textColor(this@PrintPreviewActivity))",
              "        }",
              "        val btnPrev = Button(this).apply {",
              "            layoutParams = LinearLayout.LayoutParams(100, 90)",
