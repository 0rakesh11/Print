                      <Button android:id="@+id/btnMessages" android:layout_width="0dp" android:layout_height="110dp" android:layout_columnWeight="1" android:layout_margin="6dp" android:background="#161616" android:text="💬\nMessages" android:textColor="#FFFFFF" android:textAllCaps="false"/>
                      <Button android:id="@+id/btnCallLog" android:layout_width="0dp" android:layout_height="110dp" android:layout_columnWeight="1" android:layout_margin="6dp" android:background="#161616" android:text="📞\nCall Log" android:textColor="#FFFFFF" android:textAllCaps="false"/>
                  </GridLayout>
              </ScrollView>

              <RelativeLayout
                  android:id="@+id/bottomBar"
                  android:layout_width="match_parent"
                  android:layout_height="72dp"
                  android:layout_alignParentBottom="true"
                  android:background="#141414"
                  android:padding="12dp">

                  <TextView android:id="@+id/tvPrinterTitle" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🖨️ Printer" android:textColor="#FFFFFF" android:textStyle="bold" />
                  <TextView android:id="@+id/tvPrinterStatus" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_below="@id/tvPrinterTitle" android:text="Not selected" android:textColor="#999999" android:textSize="13sp" />
