              "            text = \"1 / 1\"",
              "            textSize = 14f",
              "            setPadding(24, 0, 24, 0)",
              "            setTextColor(ThemePrefs.textColor(this@PrintPreviewActivity))",
              "        }",
              "        val btnNext = Button(this).apply {",
              "            layoutParams = LinearLayout.LayoutParams(100, 90)",
              "            text = \">\"",
              "            setTextColor(Color.WHITE)",
              "            background = ThemePrefs.roundedBox(ThemePrefs.accentColor(), 14f)",
