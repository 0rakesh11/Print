              "    </RelativeLayout>\n"
              "    <View android:id='@+id/previewDivider' android:layout_width='match_parent' android:layout_height='2dp' android:layout_below='@id/previewHeader' android:background='#0288D1' />\n"
              "    <FrameLayout android:layout_width='match_parent' android:layout_height='match_parent' android:layout_above='@+id/bottomControls' android:layout_below='@id/previewDivider' android:padding='18dp'>\n"
              "        <ImageView android:id='@+id/ivPageCanvas' android:layout_width='match_parent' android:layout_height='match_parent' android:scaleType='fitCenter' />\n"
              "    </FrameLayout>\n"
              "    <RelativeLayout android:id='@+id/bottomControls' android:layout_width='match_parent' android:layout_height='118dp' android:layout_alignParentBottom='true' android:background='#161B22' android:padding='12dp'>\n"
              "        <TextView android:id='@+id/tvPageSummary' android:layout_width='wrap_content' android:layout_height='wrap_content' android:layout_alignParentStart='true' android:layout_toStartOf='@+id/btnOptions' android:lineSpacingExtra='2dp' android:text='A4 / Letter • Normal' android:textColor='#8B949E' android:textSize='12sp' />\n"
              "        <TextView android:id='@+id/tvSelectedPrinterPreview' android:layout_width='wrap_content' android:layout_height='wrap_content' android:layout_below='@id/tvPageSummary' android:layout_marginTop='6dp' android:text='HP Ink Tank 319 (USB OTG)' android:textColor='#0288D1' android:textSize='13sp' android:textStyle='bold' />\n"
              "        <Button android:id='@+id/btnOptions' android:layout_width='110dp' android:layout_height='42dp' android:layout_alignParentEnd='true' android:background='#30363D' android:text='Options' android:textAllCaps='false' android:textColor='#FFFFFF' />\n"
              "        <Button android:id='@+id/btnPrint' android:layout_width='110dp' android:layout_height='42dp' android:layout_below='@id/btnOptions' android:layout_alignParentEnd='true' android:layout_marginTop='8dp' android:background='#0288D1' android:text='Print' android:textAllCaps='false' android:textColor='#FFFFFF' android:textStyle='bold' />\n"
              "    </RelativeLayout>\n"
              "</RelativeLayout>\n"
          )
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK
        run: |
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/*.apk PrinterShare_USB_Edition.apk

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: PrinterShare_USB_Edition
          path: PrinterShare_USB_Edition.apk
