name: Build PrinterShare USB APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Project Files
        run: |
          rm -rf * .[^.]* 2>/dev/null || true
          python3 -c '
          import os

          def w(p, c):
              if os.path.dirname(p):
                  os.makedirs(os.path.dirname(p), exist_ok=True)
              with open(p, "w", encoding="utf-8") as f:
                  f.write(c.strip() + "\n")

          w("settings.gradle", """
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PrinterShare_USB_Edition"
          include ":app"
          """)

          w("build.gradle", """
          plugins {
              id "com.android.application" version "8.2.0" apply false
              id "org.jetbrains.kotlin.android" version "1.9.20" apply false
          }
          """)

          w("gradle.properties", """
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          """)

          w("app/build.gradle", """
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }
          android {
              namespace "com.example.printershareusb"
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.printershareusb"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
                  setProperty("archivesBaseName", "PrinterShare_USB_Edition")
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation "androidx.core:core-ktx:1.12.0"
              implementation "androidx.appcompat:appcompat:1.6.1"
              implementation "com.google.android.material:material:1.11.0"
              implementation "androidx.print:print:1.0.0"
          }
          """)

          w("app/src/main/AndroidManifest.xml", """
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.usb.host" android:required="true" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />

              <application
                  android:allowBackup="true"
                  android:label="PrinterShare USB Edition"
                  android:icon="@drawable/ic_launcher_printer"
                  android:roundIcon="@drawable/ic_launcher_printer"
                  android:usesCleartextTraffic="true"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                  <activity android:name=".PrintPreviewActivity" android:exported="false" />
                  <activity android:name=".WebPrintActivity" android:exported="false" />

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" />
                      </intent-filter>
                      <meta-data
                          android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"
                          android:resource="@xml/usb_device_filter" />
                  </activity>
              </application>
          </manifest>
          """)

          w("app/src/main/res/xml/usb_device_filter.xml", """
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <usb-device class="7" />
              <usb-device vendor-id="1008" />
          </resources>
          """)

          w("app/src/main/res/drawable/ic_launcher_printer.xml", """
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0288D1" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#01579B" android:pathData="M18,18h72v72h-72z" />
              <path android:fillColor="#FFFFFF" android:pathData="M74,42H34c-4.4,0 -8,3.6 -8,8v18h10v14h36V68h10V50C82,45.6 78.4,42 74,42zM66,76H42V60h24V76zM74,53c-1.7,0 -3,-1.3 -3,-3s1.3,-3 3,-3s3,1.3 3,3S75.7,53 74,53zM70,26H38v12h32V26z" />
          </vector>
          """)

          w("app/src/main/java/com/example/printershareusb/ThemePrefs.kt", """
          package com.example.printershareusb
          import android.content.Context
          import android.graphics.Color

          object ThemePrefs {
              fun isDark(ctx: Context): Boolean = ctx.getSharedPreferences("ui_prefs", Context.MODE_PRIVATE).getBoolean("dark", true)
              fun toggle(ctx: Context) {
                  val cur = isDark(ctx)
                  ctx.getSharedPreferences("ui_prefs", Context.MODE_PRIVATE).edit().putBoolean("dark", !cur).apply()
              }
              fun bgColor(ctx: Context) = if (isDark(ctx)) Color.parseColor("#0D1117") else Color.parseColor("#F4F6F9")
              fun cardColor(ctx: Context) = if (isDark(ctx)) Color.parseColor("#161B22") else Color.parseColor("#FFFFFF")
              fun barColor(ctx: Context) = if (isDark(ctx)) Color.parseColor("#161B22") else Color.parseColor("#E5E9F0")
              fun textColor(ctx: Context) = if (isDark(ctx)) Color.parseColor("#FFFFFF") else Color.parseColor("#1C1E21")
              fun subTextColor(ctx: Context) = if (isDark(ctx)) Color.parseColor("#8B949E") else Color.parseColor("#57606A")
          }
          """)

          w("app/src/main/java/com/example/printershareusb/UsbPrinterHelper.kt", """
          package com.example.printershareusb
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.hardware.usb.*
          import android.os.Build
          import java.io.ByteArrayOutputStream
          import java.util.Arrays

          class UsbPrinterHelper(private val context: Context) {
              val usbManager: UsbManager = context.getSystemService(Context.USB_SERVICE) as UsbManager
              companion object {
                  const val ACTION_USB_PERMISSION = "com.example.printershareusb.USB_PERMISSION"
                  var selectedPrinterName: String = "Not selected"
                  var connectedUsbDevice: UsbDevice? = null
              }
              fun findUsbPrinter(): UsbDevice? {
                  for (device in usbManager.deviceList.values) {
                      if (device.vendorId == 1008 || device.deviceClass == UsbConstants.USB_CLASS_PRINTER) {
                          connectedUsbDevice = device
                          selectedPrinterName = device.productName ?: "HP Ink Tank 319 (USB OTG)"
                          return device
                      }
                      for (i in 0 until device.interfaceCount) {
                          if (device.getInterface(i).interfaceClass == UsbConstants.USB_CLASS_PRINTER) {
                              connectedUsbDevice = device
                              selectedPrinterName = device.productName ?: "HP Ink Tank 319 (USB OTG)"
                              return device
                          }
                      }
                  }
                  return null
              }
              fun requestPermission(device: UsbDevice) {
                  val flags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) PendingIntent.FLAG_MUTABLE else 0
                  val pi = PendingIntent.getBroadcast(context, 0, Intent(ACTION_USB_PERMISSION), flags)
                  usbManager.requestPermission(device, pi)
              }
              fun sendRawUsbPrintJob(bmp: Bitmap, onResult: (Boolean, String) -> Unit) {
                  val dev = connectedUsbDevice ?: findUsbPrinter()
                  if (dev == null) {
                      onResult(false, "USB OTG Printer connect nahi hai! Phone ki Settings me OTG ON karein.")
                      return
                  }
                  if (!usbManager.hasPermission(dev)) {
                      requestPermission(dev)
                      onResult(false, "USB Permission popup ko Allow karein aur dobara Print dabayein.")
                      return
                  }
                  Thread {
                      var conn: UsbDeviceConnection? = null
                      var intf: UsbInterface? = null
                      try {
                          var epOut: UsbEndpoint? = null
                          for (i in 0 until dev.interfaceCount) {
                              val itf = dev.getInterface(i)
                              for (j in 0 until itf.endpointCount) {
                                  val ep = itf.getEndpoint(j)
                                  if (ep.type == UsbConstants.USB_ENDPOINT_XFER_BULK && ep.direction == UsbConstants.USB_DIR_OUT) {
                                      intf = itf
                                      epOut = ep
                                      break
                                  }
                              }
                              if (epOut != null) break
                          }
                          if (intf == null || epOut == null) {
                              onResult(false, "Printer Bulk Endpoint nahi mila!")
                              return@Thread
                          }
                          conn = usbManager.openDevice(dev)
                          conn.claimInterface(intf, true)
                          val data = encodeToPcl(bmp)
                          var offset = 0
                          while (offset < data.size) {
                              val len = minOf(16384, data.size - offset)
                              val chunk = data.copyOfRange(offset, offset + len)
                              val sent = conn.bulkTransfer(epOut, chunk, chunk.size, 8000)
                              if (sent < 0) throw Exception("Transfer interrupted")
                              offset += len
                          }
                          onResult(true, "Print Job Sent to HP Ink Tank 319!")
                      } catch (e: Exception) {
                          onResult(false, "USB Print Error: " + e.message)
                      } finally {
                          try {
                              if (intf != null) conn?.releaseInterface(intf)
                              conn?.close()
                          } catch (_: Exception) {}
                      }
                  }.start()
              }
              private fun encodeToPcl(bmp: Bitmap): ByteArray {
                  val out = ByteArrayOutputStream()
                  val esc = 27.toByte()
                  out.write(byteArrayOf(esc))
                  out.write("%-12345X@PJL\\r\\n@PJL ENTER LANGUAGE = PCL\\r\\n".toByteArray())
                  out.write(byteArrayOf(esc))
                  out.write("E".toByteArray())
                  out.write(byteArrayOf(esc))
                  out.write("*t150R".toByteArray())
                  out.write(byteArrayOf(esc))
                  out.write("*r1A".toByteArray())
                  val w = bmp.width
                  val h = bmp.height
                  val rowBytes = (w + 7) / 8
                  val buf = ByteArray(rowBytes)
                  for (y in 0 until h) {
                      Arrays.fill(buf, 0.toByte())
                      for (x in 0 until w) {
                          val p = bmp.getPixel(x, y)
                          val lum = (0.299 * ((p shr 16) and 0xFF) + 0.587 * ((p shr 8) and 0xFF) + 0.114 * (p and 0xFF)).toInt()
                          if (lum < 165) {
                              buf[x / 8] = (buf[x / 8].toInt() or (1 shl (7 - (x % 8)))).toByte()
                          }
                      }
                      out.write(byteArrayOf(esc))
                      out.write("*b0M".toByteArray())
                      out.write(byteArrayOf(esc))
                      out.write(("*b" + rowBytes.toString() + "W").toByteArray())
                      out.write(buf)
                  }
                  out.write(byteArrayOf(esc))
                  out.write("*rB".toByteArray())
                  out.write(byteArrayOf(12.toByte()))
                  out.write(byteArrayOf(esc))
                  out.write("E".toByteArray())
                  return out.toByteArray()
              }
          }
          """)

          w("app/src/main/java/com/example/printershareusb/WebPrintActivity.kt", """
          package com.example.printershareusb
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.view.inputmethod.EditorInfo
          import android.webkit.*
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class WebPrintActivity : AppCompatActivity() {
              companion object { var capturedWebBitmap: Bitmap? = null }
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(ThemePrefs.bgColor(this@WebPrintActivity))
                  }
                  val topBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(16, 14, 16, 14)
                      setBackgroundColor(ThemePrefs.barColor(this@WebPrintActivity))
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val etUrl = EditText(this).apply {
                      layoutParams = LinearLayout.LayoutParams(0, 110, 1f)
                      hint = "Search Google or type URL..."
                      setText("https://www.google.com")
                      setSingleLine(true)
                      imeOptions = EditorInfo.IME_ACTION_GO
                      setTextColor(ThemePrefs.textColor(this@WebPrintActivity))
                      setHintTextColor(ThemePrefs.subTextColor(this@WebPrintActivity))
                      setPadding(24, 10, 24, 10)
                  }
                  val btnGo = Button(this).apply {
                      layoutParams = LinearLayout.LayoutParams(180, 110).apply { leftMargin = 12 }
                      text = "Go"
                      setBackgroundColor(Color.parseColor("#0288D1"))
                      setTextColor(Color.WHITE)
                  }
                  topBar.addView(etUrl)
                  topBar.addView(btnGo)

                  val progressBar = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply {
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 8)
                      max = 100
                  }
                  val webView = WebView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f)
                      settings.apply {
                          javaScriptEnabled = true
                          domStorageEnabled = true
                          databaseEnabled = true
                          loadsImagesAutomatically = true
                          useWideViewPort = true
                          loadWithOverviewMode = true
                          builtInZoomControls = true
                          displayZoomControls = false
                          mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                          userAgentString = "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36"
                      }
                      webChromeClient = object : WebChromeClient() {
                          override fun onProgressChanged(view: WebView?, newProgress: Int) { progressBar.progress = newProgress }
                      }
                      webViewClient = object : WebViewClient() {
                          override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest?): Boolean {
                              val u = request?.url?.toString() ?: return false
                              if (u.startsWith("http://") || u.startsWith("https://")) {
                                  etUrl.setText(u)
                                  return false
                              }
                              return true
                          }
                      }
                  }
                  val btnCapture = Button(this).apply {
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 135)
                      text = "🖨️ Open Web Page in Print Preview"
                      isAllCaps = false
                      textSize = 16f
                      setBackgroundColor(Color.parseColor("#0288D1"))
                      setTextColor(Color.WHITE)
                  }
                  root.addView(topBar)
                  root.addView(progressBar)
                  root.addView(webView)
                  root.addView(btnCapture)
                  setContentView(root)

                  val loadSmartUrl = {
                      val raw = etUrl.text.toString().trim()
                      if (raw.isNotEmpty()) {
                          val finalUrl = when {
                              raw.startsWith("http://") || raw.startsWith("https://") -> raw
                              raw.contains(".") && !raw.contains(" ") -> "https://" + raw
                              else -> "https://www.google.com/search?q=" + android.net.Uri.encode(raw)
                          }
                          etUrl.setText(finalUrl)
                          webView.loadUrl(finalUrl)
                      }
                  }
                  btnGo.setOnClickListener { loadSmartUrl() }
                  etUrl.setOnEditorActionListener { _, actionId, _ ->
                      if (actionId == EditorInfo.IME_ACTION_GO || actionId == EditorInfo.IME_ACTION_DONE) {
                          loadSmartUrl()
                          true
                      } else false
                  }
       
