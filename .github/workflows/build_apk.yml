name: Build HP319 USB Printer APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Project Files
        run: |
          # Agar user ne seedha ZIP file upload ki hai to use extract karein
          if [ -f "HP319_USB_OTG_Printer_Full_Project.zip" ]; then
            unzip -o HP319_USB_OTG_Printer_Full_Project.zip
          fi
          # Agar files kisi subfolder ke andar hain to unhe bahar layein
          if [ -d "HP319_USB_Printer_App" ]; then
            cp -r HP319_USB_Printer_App/* .
          fi
          if [ -d "HP319_USB_OTG_Printer_Full_Project" ]; then
            cp -r HP319_USB_OTG_Printer_Full_Project/* .
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: HP319-USB-Printer-APK
          path: app/build/outputs/apk/debug/app-debug.apk

