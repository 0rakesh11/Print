name: Build PrinterShare USB APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Fully Functional Project Files
        run: |
          rm -rf * .[^.]* 2>/dev/null || true
          python3 - << 'EOF'
          import os

          def w(p, c):
              if os.path.dirname(p):
                  os.makedirs(os.path.dirname(p), exist_ok=True)
              with open(p, "w", encoding="utf-8") as f:
                  f.write(c.strip() + "\n")

          w("settings.gradle", """
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PrinterShare_USB_Edition"
          include ':app'
          """)

          w("build.gradle", """
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          """)

          w("gradle.properties", """
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          """)

          w("app/build.gradle", """
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.printershareusb'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.example.printershareusb'
                  minSdk 24
                  targetSdk 34
                  versionCode 4
                  versionName '4.0'
                  setProperty('archivesBaseName', 'PrinterShare_USB_Edition')
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.print:print:1.0.0'
          }
          """)

          w("app/src/main/AndroidManifest.xml", """
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.usb.host" android:required="true" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />

              <application
                  android:allowBackup="true"
                  android:label="PrinterShare USB Edition"
                  android:icon='@drawable/ic_launcher_printer'
                  android:roundIcon='@drawable/ic_launcher_printer'
                  android:usesCleartextTraffic="true"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                  <activity android:name=".PrintPreviewActivity" android:exported="false" />
                  <activity android:name=".WebPrintActivity" android:exported="false" />

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" />
                      </intent-filter>
                      <meta-data android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" android:resource="@xml/usb_device_filter" />
                  </activity>
              </application>
          </manifest>
          """)

          w("app/src/main/res/xml/usb_device_filter.xml", """
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <usb-device class="7" />
              <usb-device vendor-id="1008" />
          </resources>
          """)

          w("app/src/main/res/drawable/ic_launcher_printer.xml", """
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0288D1" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#01579B" android:pathData="M18,18h72v72h-72z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M74,42H34c-4.4,0 -8,3.6 -8,8v18h10v14h36V68h10V50C82,45.6 78.4,42 74,42zM66,76H42V60h24V76zM74,53c-1.7,0 -3,-1.3 -3,-3s1.3,-3 3,-3s3,1.3 3,3S75.7,53 74,53zM70,26H38v12h32V26z"/>
          </vector>
          """)

          w("app/src/main/java/com/example/printershareusb/ThemePrefs.kt", """
          package com.example.printershareusb
          import android.content.Context
          import android.graphics.Color
          object ThemePrefs {
              fun isDark(ctx: Context): Boolean = ctx.getSharedPreferences("ui_prefs", Context.MODE_PRIVATE).getBoolean("dark", true)
              fun toggle(ctx: Context) {
                  val cur = isDark(ctx)
                  ctx.getSharedPreferences("ui_prefs", Context.MODE_PRIVATE).edit().putBoolean("dark", !cur).apply()
              }
              fun bgColor(ctx: Context) = if (isDark(ctx)) Color.parseColor("#0D1117") else Color.parseColor("#F4F6F9")
              fun cardColor(ctx: Context) = if (isDark(ctx)) Color.parseColor("#161B22") else Color.parseColor("#FFFFFF")
              fun barColor(ctx: Context) = if (isDark(ctx)) Color.parseColor("#161B22") else Color.parseColor("#E5E9F0")
              fun textColor(ctx: Context) = if (isDark(ctx)) Color.parseColor("#FFFFFF") else Color.parseColor("#1C1E21")
              fun subTextColor(ctx: Context) = if (isDark(ctx)) Color.parseColor("#8B949E") else Color.parseColor("#57606A")
          }
          """)

          w("app/src/main/java/com/example/printershareusb/UsbPrinterHelper.kt", """
          package com.example.printershareusb
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.hardware.usb.*
          import android.os.Build
          import java.io.ByteArrayOutputStream
          import java.util.Arrays

          class UsbPrinterHelper(private val context: Context) {
              val usbManager: UsbManager = context.getSystemService(Context.USB_SERVICE) as UsbManager
              companion object {
                  const val ACTION_USB_PERMISSION = "com.example.printershareusb.USB_PERMISSION"
                  var selectedPrinterName: String = "HP Ink Tank 319 (Direct USB OTG)"
                  var connectedUsbDevice: UsbDevice? = null
              }
              fun findUsbPrinter(): UsbDevice? {
                  for (device in usbManager.deviceList.values) {
                      if (device.vendorId == 1008 || device.deviceClass == UsbConstants.USB_CLASS_PRINTER) {
                          connectedUsbDevice = device
                          selectedPrinterName = device.productName ?: "HP Ink Tank 319 (USB OTG)"
                          return device
                      }
                      for (i in 0 until device.interfaceCount) {
                          if (device.getInterface(i).interfaceClass == UsbConstants.USB_CLASS_PRINTER) {
                              connectedUsbDevice = device
                              selectedPrinterName = device.productName ?: "HP Ink Tank 319 (USB OTG)"
                              return device
                          }
                      }
                  }
                  return null
              }
              fun requestPermission(device: UsbDevice) {
                  val flags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) PendingIntent.FLAG_MUTABLE else 0
                  val pi = PendingIntent.getBroadcast(context, 0, Intent(ACTION_USB_PERMISSION), flags)
                  usbManager.requestPermission(device, pi)
              }
              fun sendRawUsbPrintJob(bmp: Bitmap, onResult: (Boolean, String) -> Unit) {
                  val dev = connectedUsbDevice ?: findUsbPrinter()
                  if (dev == null) {
                      onResult(false, "USB OTG Printer connect nahi hai! Phone me OTG ON karein.")
                      return
                  }
                  if (!usbManager.hasPermission(dev)) {
                      requestPermission(dev)
                      onResult(false, "USB Permission allow karein aur dobara Print dabayein.")
                      return
                  }
                  Thread {
                      var conn: UsbDeviceConnection? = null
                      var intf: UsbInterface? = null
                      try {
                          var epOut: UsbEndpoint? = null
                          for (i in 0 until dev.interfaceCount) {
                              val itf = dev.getInterface(i)
                              for (j in 0 until itf.endpointCount) {
                                  val ep = itf.getEndpoint(j)
                                  if (ep.type == UsbConstants.USB_ENDPOINT_XFER_BULK && ep.direction == UsbConstants.USB_DIR_OUT) {
                                      intf = itf; epOut = ep; break
                                  }
                              }
                              if (epOut != null) break
                          }
                          if (intf == null || epOut == null) {
                              onResult(false, "Printer Bulk Endpoint nahi mila!")
                              return@Thread
                          }
                          conn = usbManager.openDevice(dev)
                          conn.claimInterface(intf, true)
                          val data = encodeToPcl(bmp)
                          var offset = 0
                          while (offset < data.size) {
                              val len = minOf(16384, data.size - offset)
                              val chunk = data.copyOfRange(offset, offset + len)
                              val sent = conn.bulkTransfer(epOut, chunk, chunk.size, 8000)
                              if (sent < 0) throw Exception("Transfer interrupted")
                              offset += len
                          }
                          onResult(true, "Print Job Sent Successfully to HP 319!")
                      } catch (e: Exception) {
                          onResult(false, "USB Print Error: " + e.message)
                      } finally {
                          try { if (intf != null) conn?.releaseInterface(intf); conn?.close() } catch (_: Exception) {}
                      }
                  }.start()
              }
              private fun encodeToPcl(bmp: Bitmap): ByteArray {
                  val out = ByteArrayOutputStream()
                  val esc = 27.toByte()
                  out.write(byteArrayOf(esc))
                  out.write("%-12345X@PJL\r\n@PJL ENTER LANGUAGE = PCL\r\n".toByteArray())
                  out.write(byteArrayOf(esc)); out.write("E".toByteArray())
                  out.write(byteArrayOf(esc)); out.write("*t150R".toByteArray())
                  out.write(byteArrayOf(esc)); out.write("*r1A".toByteArray())
                  val w = bmp.width; val h = bmp.height
                  val rowBytes = (w + 7) / 8
                  val buf = ByteArray(rowBytes)
                  for (y in 0 until h) {
                      Arrays.fill(buf, 0.toByte())
                      for (x in 0 until w) {
                          val p = bmp.getPixel(x, y)
                          val lum = (0.299 * ((p shr 16) and 0xFF) + 0.587 * ((p shr 8) and 0xFF) + 0.114 * (p and 0xFF)).toInt()
                          if (lum < 165) buf[x / 8] = (buf[x / 8].toInt() or (1 shl (7 - (x % 8)))).toByte()
                      }
                      out.write(byteArrayOf(esc)); out.write("*b0M".toByteArray())
                      out.write(byteArrayOf(esc)); out.write(("*b" + rowBytes.toString() + "W").toByteArray())
                      out.write(buf)
                  }
                  out.write(byteArrayOf(esc)); out.write("*rB".toByteArray())
                  out.write(byteArrayOf(12.toByte()))
                  out.write(byteArrayOf(esc)); out.write("E".toByteArray())
                  return out.toByteArray()
              }
          }
          """)

          w("app/src/main/java/com/example/printershareusb/WebPrintActivity.kt", """
          package com.example.printershareusb
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.view.inputmethod.EditorInfo
          import android.webkit.*
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class WebPrintActivity : AppCompatActivity() {
              companion object { var capturedWebBitmap: Bitmap? = null }
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(ThemePrefs.bgColor(this@WebPrintActivity))
                  }
                  val topBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(16, 14, 16, 14)
                      setBackgroundColor(ThemePrefs.barColor(this@WebPrintActivity))
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val etUrl = EditText(this).apply {
                      layoutParams = LinearLayout.LayoutParams(0, 110, 1f)
                      hint = "Search Google or type URL..."
                      setText("https://www.google.com")
                      setSingleLine(true)
                      imeOptions = EditorInfo.IME_ACTION_GO
                      setTextColor(ThemePrefs.textColor(this@WebPrintActivity))
                      setHintTextColor(ThemePrefs.subTextColor(this@WebPrintActivity))
                      setPadding(24, 10, 24, 10)
                  }
                  val btnGo = Button(this).apply {
                      layoutParams = LinearLayout.LayoutParams(180, 110).apply { leftMargin = 12 }
                      text = "Go"
                      setBackgroundColor(Color.parseColor("#0288D1"))
                      setTextColor(Color.WHITE)
                  }
                  topBar.addView(etUrl); topBar.addView(btnGo)
                  val progressBar = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply {
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 8)
                      max = 100
                  }
                  val webView = WebView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f)
                      settings.apply {
                          javaScriptEnabled = true
                          domStorageEnabled = true
                          databaseEnabled = true
                          loadsImagesAutomatically = true
                          useWideViewPort = true
                          loadWithOverviewMode = true
                          builtInZoomControls = true
                          displayZoomControls = false
                          mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                          userAgentString = "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36"
                      }
                      webChromeClient = object : WebChromeClient() {
                          override fun onProgressChanged(view: WebView?, newProgress: Int) { progressBar.progress = newProgress }
                      }
                      webViewClient = object : WebViewClient() {
                          override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest?): Boolean {
                              val u = request?.url?.toString() ?: return false
                              if (u.startsWith("http://") || u.startsWith("https://")) {
                                  etUrl.setText(u); return false
                              }
                              return true
                          }
                      }
                  }
                  val btnCapture = Button(this).apply {
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 135)
                      text = "🌐 Capture & Send to Print Preview"
                      isAllCaps = false; textSize = 16f
                      setBackgroundColor(Color.parseColor("#0288D1"))
                      setTextColor(Color.WHITE)
                  }
                  root.addView(topBar); root.addView(progressBar); root.addView(webView); root.addView(btnCapture)
                  setContentView(root)

                  val loadSmartUrl = {
                      val raw = etUrl.text.toString().trim()
                      if (raw.isNotEmpty()) {
                          val finalUrl = when {
                              raw.startsWith("http://") || raw.startsWith("https://") -> raw
                              raw.contains(".") && !raw.contains(" ") -> "https://" + raw
                              else -> "https://www.google.com/search?q=" + android.net.Uri.encode(raw)
                          }
                          etUrl.setText(finalUrl); webView.loadUrl(finalUrl)
                      }
                  }
                  btnGo.setOnClickListener { loadSmartUrl() }
                  etUrl.setOnEditorActionListener { _, actionId, _ ->
                      if (actionId == EditorInfo.IME_ACTION_GO || actionId == EditorInfo.IME_ACTION_DONE) {
                          loadSmartUrl(); true
                      } else false
                  }
                  webView.loadUrl("https://www.google.com")
                  btnCapture.setOnClickListener {
                      val w = webView.width.coerceAtLeast(800)
                      val h = webView.height.coerceAtLeast(1000)
                      val bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                      val c = Canvas(bmp); c.drawColor(Color.WHITE); webView.draw(c)
                      capturedWebBitmap = bmp
                      startActivity(Intent(this, PrintPreviewActivity::class.java).putExtra("FROM_WEB", true))
                  }
              }
          }
          """)

          w("app/src/main/java/com/example/printershareusb/PrintPreviewActivity.kt", """
          package com.example.printershareusb
          import android.app.AlertDialog
          import android.graphics.*
          import android.graphics.pdf.PdfRenderer
          import android.net.Uri
          import android.os.Bundle
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.print.PrintHelper

          class PrintPreviewActivity : AppCompatActivity() {
              private lateinit var ivPageCanvas: ImageView
              private lateinit var tvPageSummary: TextView
              private lateinit var tvSelectedPrinterPreview: TextView
              private lateinit var tvPageIndicator: TextView
              private lateinit var usbHelper: UsbPrinterHelper
              private val sourceBitmaps = mutableListOf<Bitmap>()
              private var renderedPageBitmap: Bitmap? = null
              private var isPdf = false
              private var pdfUri: Uri? = null
              private var currentPageIndex = 0
              private var totalPages = 1
              private var pictureSize = "4x6 in (10x15 cm)"
              private var pictureScaling = "Crop"
              private var pictureAlign = "Center"
              private var pageLayout = "Single picture"
              private var pageMargins = "Normal"
              private var pageOrientation = "Auto"

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_print_preview)
                  findViewById<RelativeLayout>(R.id.previewRoot).setBackgroundColor(ThemePrefs.bgColor(this))
                  findViewById<RelativeLayout>(R.id.previewHeader).setBackgroundColor(ThemePrefs.barColor(this))
                  findViewById<RelativeLayout>(R.id.bottomControls).setBackgroundColor(ThemePrefs.barColor(this))
                  findViewById<TextView>(R.id.tvPreviewTitle).setTextColor(ThemePrefs.textColor(this))

                  ivPageCanvas = findViewById(R.id.ivPageCanvas)
                  tvPageSummary = findViewById(R.id.tvPageSummary)
                  tvSelectedPrinterPreview = findViewById(R.id.tvSelectedPrinterPreview)
                  tvPageIndicator = findViewById(R.id.tvPageIndicator)
                  usbHelper = UsbPrinterHelper(this)

                  tvPageSummary.setTextColor(ThemePrefs.subTextColor(this))
                  tvPageIndicator.setTextColor(ThemePrefs.textColor(this))
                  tvSelectedPrinterPreview.text = "🖨️ " + UsbPrinterHelper.selectedPrinterName

                  isPdf = intent.getBooleanExtra("IS_PDF", false)
                  val uriList = intent.getStringArrayListExtra("FILE_URIS")
                  val textContent = intent.getStringExtra("TEXT_CONTENT")

                  if (WebPrintActivity.capturedWebBitmap != null && intent.getBooleanExtra("FROM_WEB", false)) {
                      sourceBitmaps.add(WebPrintActivity.capturedWebBitmap!!)
                      pictureSize = "Fit to page"; pictureScaling = "Inside"
                  } else if (textContent != null) {
                      sourceBitmaps.add(createBitmapFromText(textContent))
                      pictureSize = "Fit to page"; pictureScaling = "Inside"
                  } else if (!uriList.isNullOrEmpty()) {
                      if (isPdf) {
                          pdfUri = Uri.parse(uriList[0])
                          pictureSize = "Fit to page"; pictureScaling = "Inside"
                          loadPdfPage(0)
                      } else {
                          for (u in uriList) { loadBitmapFromUri(Uri.parse(u))?.let { sourceBitmaps.add(it) } }
                      }
                  }
                  findViewById<Button>(R.id.btnPrevPage).setOnClickListener {
                      if (isPdf && currentPageIndex > 0) { currentPageIndex--; loadPdfPage(currentPageIndex); renderPageCanvas() }
                  }
                  findViewById<Button>(R.id.btnNextPage).setOnClickListener {
                      if (isPdf && currentPageIndex < totalPages - 1) { currentPageIndex++; loadPdfPage(currentPageIndex); renderPageCanvas() }
                  }
                  findViewById<Button>(R.id.btnOptions).setOnClickListener { showPrintOptionsMenu() }
                  findViewById<Button>(R.id.btnPrint).setOnClickListener { showFinalPrintDialog() }
                  renderPageCanvas()
              }

              private fun showPrintOptionsMenu() {
                  val menuItems = arrayOf(
                      "Picture Size : " + pictureSize,
                      "Picture Scaling : " + pictureScaling,
                      "Picture Align : " + pictureAlign,
                      "Page Layout : " + pageLayout,
                      "Page Margins : " + pageMargins,
                      "Page Orientation : " + pageOrientation,
                      "Select Printer"
                  )
                  AlertDialog.Builder(this)
                      .setTitle("Print Options")
                      .setItems(menuItems) { _, which ->
                          when (which) {
                              0 -> showRadioDialog("Picture Size", arrayOf("Original size", "Fit to page", "3.5x5 in (9x13 cm)", "4x6 in (10x15 cm)", "5x7 in (13x18 cm)", "8x10 in (20x25 cm)", "8x12 in (20x30 cm)", "11x14 in (28x36 cm)"), pictureSize) { pictureSize = it; renderPageCanvas() }
                              1 -> showRadioDialog("Picture Scaling", arrayOf("Crop", "Inside"), pictureScaling) { pictureScaling = it; renderPageCanvas() }
                              2 -> showRadioDialog("Picture Align", arrayOf("Center", "Top Left", "Top Right", "Bottom Left", "Bottom Right", "Middle Left", "Middle Right", "Top Middle", "Bottom Middle"), pictureAlign) { pictureAlign = it; renderPageCanvas() }
                              3 -> showRadioDialog("Page Layout", arrayOf("Single picture", "Grid 2x1", "Grid 2x2", "Grid 3x2", "Grid 3x3"), pageLayout) { pageLayout = it; renderPageCanvas() }
                              4 -> showRadioDialog("Page Margins", arrayOf("No (minimum allowable)", "Small", "Normal", "Large"), pageMargins) { pageMargins = it; renderPageCanvas() }
                              5 -> showRadioDialog("Page Orientation", arrayOf("Auto", "Portrait", "Landscape"), pageOrientation) { pageOrientation = it; renderPageCanvas() }
                              6 -> {
                                  val dev = usbHelper.findUsbPrinter()
                                  if (dev != null) {
                                      usbHelper.requestPermission(dev)
                                      tvSelectedPrinterPreview.text = "🖨️ " + UsbPrinterHelper.selectedPrinterName
                                  } else {
                                      Toast.makeText(this, "USB OTG Printer nahi mila!", Toast.LENGTH_SHORT).show()
                                  }
                              }
                          }
                      }.show()
              }

              private fun showRadioDialog(title: String, options: Array<String>, currentVal: String, onConfirmed: (String) -> Unit) {
                  var selectedIdx = options.indexOf(currentVal).coerceAtLeast(0)
                  AlertDialog.Builder(this)
                      .setTitle(title)
                      .setSingleChoiceItems(options, selectedIdx) { _, which -> selectedIdx = which }
                      .setPositiveButton("OK") { _, _ -> onConfirmed(options[selectedIdx]) }
                      .setNegativeButton("Cancel", null).show()
              }

              private fun renderPageCanvas() {
                  if (sourceBitmaps.isEmpty()) return
                  val firstBmp = sourceBitmaps[0]
                  val isLandscape = when (pageOrientation) {
                      "Landscape" -> true
                      "Portrait" -> false
                      else -> firstBmp.width > firstBmp.height
                  }
                  val pageW = if (isLandscape) 1650 else 1275
                  val pageH = if (isLandscape) 1275 else 1650
                  val sheetBmp = Bitmap.createBitmap(pageW, pageH, Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(sheetBmp)
                  canvas.drawColor(Color.WHITE)

                  val marginPx = when (pageMargins) {
                      "No (minimum allowable)" -> 0
                      "Small" -> 36
                      "Normal" -> 75
                      "Large" -> 135
                      else -> 75
                  }
                  val availW = pageW - (marginPx * 2)
                  val availH = pageH - (marginPx * 2)

                  if (pageLayout.startsWith("Grid")) {
                      val (rows, cols) = when (pageLayout) {
                          "Grid 2x1" -> Pair(2, 1)
                          "Grid 2x2" -> Pair(2, 2)
                          "Grid 3x2" -> Pair(3, 2)
                          "Grid 3x3" -> Pair(3, 3)
                          else -> Pair(1, 1)
                      }
                      val cellW = availW / cols; val cellH = availH / rows; val gap = 12; var idx = 0
                      for (r in 0 until rows) {
                          for (c in 0 until cols) {
                              val bmp = sourceBitmaps[idx % sourceBitmaps.size]
                              drawBitmapInBox(canvas, bmp, Rect(marginPx + c * cellW + gap, marginPx + r * cellH + gap, marginPx + (c + 1) * cellW - gap, marginPx + (r + 1) * cellH - gap))
                              idx++
                          }
                      }
                  } else {
                      var (boxW, boxH) = when (pictureSize) {
                          "3.5x5 in (9x13 cm)" -> Pair(525, 750)
                          "4x6 in (10x15 cm)" -> Pair(600, 900)
                          "5x7 in (13x18 cm)" -> Pair(750, 1050)
                          "8x10 in (20x25 cm)" -> Pair(1200, 1500)
                          "8x12 in (20x30 cm)" -> Pair(1200, 1650)
                          "11x14 in (28x36 cm)" -> Pair(1650, 2100)
                          "Original size" -> Pair(firstBmp.width.coerceAtMost(availW), firstBmp.height.coerceAtMost(availH))
                          else -> Pair(availW, availH)
                      }
                      if (isLandscape && boxH > boxW) { val tmp = boxW; boxW = boxH; boxH = tmp }
                      boxW = boxW.coerceAtMost(availW); boxH = boxH.coerceAtMost(availH)
                      val left = when {
                          pictureAlign.contains("Left") -> marginPx
                          pictureAlign.contains("Right") -> pageW - marginPx - boxW
                          else -> marginPx + (availW - boxW) / 2
                      }
                      val top = when {
                          pictureAlign.contains("Top") -> marginPx
                          pictureAlign.contains("Bottom") -> pageH - marginPx - boxH
                          else -> marginPx + (availH - boxH) / 2
                      }
                      drawBitmapInBox(canvas, firstBmp, Rect(left, top, left + boxW, top + boxH))
                  }
                  renderedPageBitmap = sheetBmp
                  ivPageCanvas.setImageBitmap(sheetBmp)
                  tvPageIndicator.text = (currentPageIndex + 1).toString() + " / " + totalPages.toString()
                  tvPageSummary.text = "A4/Letter • " + pageMargins + " • " + pageOrientation + "\n" + pictureSize + " (" + pictureScaling + ", " + pictureAlign + ")"
              }

              private fun drawBitmapInBox(canvas: Canvas, bmp: Bitmap, targetRect: Rect) {
                  val paint = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)
                  val boxW = targetRect.width(); val boxH = targetRect.height()
                  if (pictureScaling == "Crop") {
                      val scale = maxOf(boxW.toFloat() / bmp.width, boxH.toFloat() / bmp.height)
                      val cropW = (boxW / scale).toInt(); val cropH = (boxH / scale).toInt()
                      val cropX = (bmp.width - cropW) / 2; val cropY = (bmp.height - cropH) / 2
                      canvas.drawBitmap(bmp, Rect(cropX, cropY, cropX + cropW, cropY + cropH), targetRect, paint)
                  } else {
                      val scale = minOf(boxW.toFloat() / bmp.width, boxH.toFloat() / bmp.height)
                      val drawW = (bmp.width * scale).toInt(); val drawH = (bmp.height * scale).toInt()
                      val drawLeft = targetRect.left + (boxW - drawW) / 2; val drawTop = targetRect.top + (boxH - drawH) / 2
                      canvas.drawBitmap(bmp, null, Rect(drawLeft, drawTop, drawLeft + drawW, drawTop + drawH), paint)
                  }
              }

              private fun showFinalPrintDialog() {
                  val finalBmp = renderedPageBitmap ?: return
                  val methods = arrayOf(
                      "🎨 Color / Photo Print (HP OTG System Spooler / Save PDF)",
                      "⚡ Direct Raw USB OTG Transfer (HP PCL3 Monochrome)"
                  )
                  AlertDialog.Builder(this)
                      .setTitle("Print on HP Ink Tank 319")
                      .setItems(methods) { _, which ->
                          if (which == 0) {
                              // Trigger Android System Print Spooler / Print to PDF / WiFi Network Print
                              val printManager = getSystemService(Context.PRINT_SERVICE) as android.print.PrintManager
                              printManager.print("PrinterShare_Job", object : android.print.PrintDocumentAdapter() {
                                  override fun onLayout(oldAttributes: android.print.PrintAttributes?, newAttributes: android.print.PrintAttributes?, cancellationSignal: android.os.CancellationSignal?, callback: android.print.PrintDocumentAdapter.LayoutResultCallback?, extras: Bundle?) {
                                      if (cancellationSignal?.isCanceled == true) { callback?.onLayoutCancelled(); return }
                                      val pInfo = android.print.PrintDocumentInfo.Builder("PrinterShare_Doc.pdf").setContentType(android.print.PrintDocumentInfo.CONTENT_TYPE_DOCUMENT).setPageCount(1).build()
                                      callback?.onLayoutFinished(pInfo, true)
                                  }
                                  override fun onWrite(pages: Array<out android.print.PageRange>?, destination: android.os.ParcelFileDescriptor?, cancellationSignal: android.os.CancellationSignal?, callback: android.print.PrintDocumentAdapter.WriteResultCallback?) {
                                      try {
                                          val pdfDoc = android.graphics.pdf.PrintedPdfDocument(this@PrintPreviewActivity, android.print.PrintAttributes.Builder().setMediaSize(android.print.PrintAttributes.MediaSize.ISO_A4).setResolution(android.print.PrintAttributes.Resolution("pdf", "pdf", 300, 300)).setMinMargins(android.print.PrintAttributes.Margins.NO_MARGINS).build())
                                          val page = pdfDoc.startPage(1)
                                          page.canvas.drawBitmap(finalBmp, 0f, 0f, null)
                                          pdfDoc.finishPage(page)
                                          pdfDoc.writeTo(java.io.FileOutputStream(destination?.fileDescriptor))
                                          pdfDoc.close()
                                          callback?.onWriteFinished(arrayOf(android.print.PageRange.ALL_PAGES))
                                      } catch (e: Exception) {
                                          callback?.onWriteFailed(e.message)
                                      }
                                  }
                              }, null)
                          } else {
                              usbHelper.sendRawUsbPrintJob(finalBmp) { _, message ->
                                  runOnUiThread { Toast.makeText(this, message, Toast.LENGTH_LONG).show() }
                              }
                          }
                      }.show()
              }

              private fun loadBitmapFromUri(uri: Uri): Bitmap? {
                  return try { contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it) } } catch (_: Exception) { null }
              }

              private fun loadPdfPage(pageIndex: Int) {
                  val uri = pdfUri ?: return
                  try {
                      val fd = contentResolver.openFileDescriptor(uri, "r") ?: return
                      val renderer = PdfRenderer(fd)
                      totalPages = renderer.pageCount
                      val page = renderer.openPage(pageIndex.coerceIn(0, totalPages - 1))
                      val bmp = Bitmap.createBitmap(page.width * 2, page.height * 2, Bitmap.Config.ARGB_8888)
                      Canvas(bmp).drawColor(Color.WHITE)
                      page.render(bmp, null, null, PdfRenderer.Page.RENDER_MODE_FOR_PRINT)
                      page.close()
                      renderer.close()
                      fd.close()
                      sourceBitmaps.clear()
                      sourceBitmaps.add(bmp)
                  } catch (e: Exception) {
                      Toast.makeText(this, "PDF Error: " + e.message, Toast.LENGTH_SHORT).show()
                  }
              }

              private fun createBitmapFromText(text: String): Bitmap {
                  val bmp = Bitmap.createBitmap(1200, 1600, Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(bmp)
                  canvas.drawColor(Color.WHITE)
                  val paint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.BLACK; textSize = 36f }
                  var y = 100f
                  for (line in text.split("\n")) {
                      canvas.drawText(line, 60f, y, paint)
                      y += 52f
                  }
                  return bmp
              }
          }
          """)

          w("app/src/main/java/com/example/printershareusb/MainActivity.kt", """
          package com.example.printershareusb
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.*
          import android.hardware.usb.UsbDevice
          import android.hardware.usb.UsbManager
          import android.os.Build
          import android.os.Bundle
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private lateinit var usbHelper: UsbPrinterHelper
              private lateinit var tvPrinterStatus: TextView
              private val PICK_IMAGE = 201
              private val PICK_PDF = 202

              private val usbReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context, intent: Intent) {
                      if (UsbPrinterHelper.ACTION_USB_PERMISSION == intent.action) {
                          val device: UsbDevice? = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                              intent.getParcelableExtra(UsbManager.EXTRA_DEVICE, UsbDevice::class.java)
                          } else {
                              @Suppress("DEPRECATION")
                              intent.getParcelableExtra(UsbManager.EXTRA_DEVICE)
                          }
                          if (intent.getBooleanExtra(UsbManager.EXTRA_PERMISSION_GRANTED, false) && device != null) {
                              UsbPrinterHelper.connectedUsbDevice = device
                              UsbPrinterHelper.selectedPrinterName = device.productName ?: "HP Ink Tank 319 (USB)"
                              tvPrinterStatus.text = UsbPrinterHelper.selectedPrinterName
                              Toast.makeText(context, "Connected: " + UsbPrinterHelper.selectedPrinterName, Toast.LENGTH_SHORT).show()
                          }
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  usbHelper = UsbPrinterHelper(this)
                  tvPrinterStatus = findViewById(R.id.tvPrinterStatus)
                  applyDynamicTheme()

                  val filter = IntentFilter(UsbPrinterHelper.ACTION_USB_PERMISSION)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(usbReceiver, filter, Context.RECEIVER_NOT_EXPORTED)
                  } else {
                      registerReceiver(usbReceiver, filter)
                  }
                  usbHelper.findUsbPrinter()?.let { tvPrinterStatus.text = UsbPrinterHelper.selectedPrinterName }

                  findViewById<Button>(R.id.btnThemeToggle).setOnClickListener {
                      ThemePrefs.toggle(this)
                      applyDynamicTheme()
                  }
                  findViewById<Button>(R.id.btnSelectPrinter).setOnClickListener { showSelectPrinterDialog() }
                  findViewById<Button>(R.id.btnPictures).setOnClickListener {
                      val intent = Intent(Intent.ACTION_GET_CONTENT).apply { type = "image/*"; putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true) }
                      startActivityForResult(Intent.createChooser(intent, "Select Pictures"), PICK_IMAGE)
                  }
                  findViewById<Button>(R.id.btnDocuments).setOnClickListener {
                      val intent = Intent(Intent.ACTION_GET_CONTENT).apply { type = "application/pdf" }
                      startActivityForResult(Intent.createChooser(intent, "Select PDF Document"), PICK_PDF)
                  }
                  findViewById<Button>(R.id.btnWebPages).setOnClickListener {
                      startActivity(Intent(this, WebPrintActivity::class.java))
                  }
                  findViewById<Button>(R.id.btnQuickText).setOnClickListener {
                      val input = EditText(this).apply { hint = "Type or paste any text / document note here..."; setPadding(40, 30, 40, 30) }
                      AlertDialog.Builder(this).setTitle("Quick Text / Note Print").setView(input)
                          .setPositiveButton("Open Preview") { _, _ ->
                              val txt = input.text.toString().ifBlank { "Sample Print Page - HP Ink Tank 319" }
                              startActivity(Intent(this, PrintPreviewActivity::class.java).putExtra("TEXT_CONTENT", txt))
                          }.setNegativeButton("Cancel", null).show()
                  }
              }

              private fun applyDynamicTheme() {
                  val isDark = ThemePrefs.isDark(this)
                  findViewById<RelativeLayout>(R.id.mainRoot).setBackgroundColor(ThemePrefs.bgColor(this))
                  findViewById<RelativeLayout>(R.id.headerBar).setBackgroundColor(ThemePrefs.barColor(this))
                  findViewById<RelativeLayout>(R.id.bottomBar).setBackgroundColor(ThemePrefs.barColor(this))
                  findViewById<TextView>(R.id.tvAppTitle).setTextColor(ThemePrefs.textColor(this))
                  findViewById<TextView>(R.id.tvPrinterTitle).setTextColor(ThemePrefs.textColor(this))
                  findViewById<TextView>(R.id.tvPrinterStatus).setTextColor(ThemePrefs.subTextColor(this))
                  findViewById<Button>(R.id.btnThemeToggle).text = if (isDark) "Light Mode" else "Dark Mode"
                  val cardIds = intArrayOf(R.id.btnPictures, R.id.btnDocuments, R.id.btnWebPages, R.id.btnQuickText)
                  for (id in cardIds) {
                      findViewById<Button>(id).apply {
                          setBackgroundColor(ThemePrefs.cardColor(this@MainActivity))
                          setTextColor(ThemePrefs.textColor(this@MainActivity))
                      }
                  }
              }

              private fun showSelectPrinterDialog() {
                  val items = arrayOf(
                      "🔌  Direct USB OTG Connected",
                      "📡  Nearby WiFi Printer",
                      "🦷  Nearby Bluetooth Printer",
                      "📄  Print to PDF / System Spooler"
                  )
                  AlertDialog.Builder(this).setTitle("Select Printer Mode").setItems(items) { _, which ->
                      when (which) {
                          0 -> {
                              val dev = usbHelper.findUsbPrinter()
                              if (dev != null) {
                                  usbHelper.requestPermission(dev)
                                  tvPrinterStatus.text = dev.productName ?: "HP Ink Tank 319 (USB OTG)"
                                  Toast.makeText(this, "USB Printer Connected Successfully!", Toast.LENGTH_SHORT).show()
                              } else {
                                  UsbPrinterHelper.selectedPrinterName = "Direct USB (Waiting for OTG...)"
                                  tvPrinterStatus.text = UsbPrinterHelper.selectedPrinterName
                                  Toast.makeText(this, "USB Printer nahi mila! OTG cable aur printer check karein.", Toast.LENGTH_LONG).show()
                              }
                          }
                          1 -> {
                              // Trigger Android Print Framework to discover Network / WiFi Printers
                              try {
                                  val printManager = getSystemService(Context.PRINT_SERVICE) as android.print.PrintManager
                                  printManager.print("WiFi_Discovery", object : android.print.PrintDocumentAdapter() {
                                      override fun onLayout(o: android.print.PrintAttributes?, n: android.print.PrintAttributes?, c: android.os.CancellationSignal?, cb: android.print.PrintDocumentAdapter.LayoutResultCallback?, e: Bundle?) {}
                                      override fun onWrite(p: Array<out android.print.PageRange>?, d: android.os.ParcelFileDescriptor?, c: android.os.CancellationSignal?, cb: android.print.PrintDocumentAdapter.WriteResultCallback?) {}
                                  }, null)
                                  UsbPrinterHelper.selectedPrinterName = "Nearby WiFi Printer (System Spooler)"
                                  tvPrinterStatus.text = UsbPrinterHelper.selectedPrinterName
                              } catch (e: Exception) {
                                  Toast.makeText(this, "WiFi Print Error: " + e.message, Toast.LENGTH_SHORT).show()
                              }
                          }
                          2 -> {
                              Toast.makeText(this, "Bluetooth pairing is managed via Android System Settings.", Toast.LENGTH_LONG).show()
                              UsbPrinterHelper.selectedPrinterName = "Bluetooth Printer"
                              tvPrinterStatus.text = UsbPrinterHelper.selectedPrinterName
                          }
                          3 -> {
                              // Direct Print to PDF / System Spooler
                              val printManager = getSystemService(Context.PRINT_SERVICE) as android.print.PrintManager
                              printManager.print("PDF_Export", object : android.print.PrintDocumentAdapter() {
                                  override fun onLayout(o: android.print.PrintAttributes?, n: android.print.PrintAttributes?, c: android.os.CancellationSignal?, cb: android.print.PrintDocumentAdapter.LayoutResultCallback?, e: Bundle?) {
                                      val pInfo = android.print.PrintDocumentInfo.Builder("Export.pdf").setContentType(android.print.PrintDocumentInfo.CONTENT_TYPE_DOCUMENT).setPageCount(1).build()
                                      cb?.onLayoutFinished(pInfo, true)
                                  }
                                  override fun onWrite(p: Array<out android.print.PageRange>?, d: android.os.ParcelFileDescriptor?, c: android.os.CancellationSignal?, cb: android.print.PrintDocumentAdapter.WriteResultCallback?) {
                                      try {
                                          val pdfDoc = android.graphics.pdf.PrintedPdfDocument(this@MainActivity, android.print.PrintAttributes.Builder().setMediaSize(android.print.PrintAttributes.MediaSize.ISO_A4).build())
                                          val page = pdfDoc.startPage(1)
                                          page.canvas.drawColor(Color.WHITE)
                                          val paint = Paint().apply { color = Color.BLACK; textSize = 40f }
                                          page.canvas.drawText("HP Ink Tank 319 - Test Page / PDF Export", 100f, 150f, paint)
                                          pdfDoc.finishPage(page)
                                          pdfDoc.writeTo(java.io.FileOutputStream(d?.fileDescriptor))
                                          pdfDoc.close()
                                          cb?.onWriteFinished(arrayOf(android.print.PageRange.ALL_PAGES))
                                      } catch (err: Exception) { cb?.onWriteFailed(err.message) }
                                  }
                              }, null)
                              UsbPrinterHelper.selectedPrinterName = "Print to PDF / Spooler"
                              tvPrinterStatus.text = UsbPrinterHelper.selectedPrinterName
                          }
                      }
                  }.show()
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (resultCode == Activity.RESULT_OK && data != null) {
                      val uris = ArrayList<String>()
                      if (data.clipData != null) {
                          for (i in 0 until data.clipData!!.itemCount) uris.add(data.clipData!!.getItemAt(i).uri.toString())
                      } else if (data.data != null) {
                          uris.add(data.data!!.toString())
                      }
                      if (uris.isNotEmpty()) {
                          val intent = Intent(this, PrintPreviewActivity::class.java).apply {
                              putStringArrayListExtra("FILE_URIS", uris)
                              putExtra("IS_PDF", requestCode == PICK_PDF)
                          }
                          startActivity(intent)
                      }
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  try { unregisterReceiver(usbReceiver) } catch (_: Exception) {}
              }
          }
          """)

