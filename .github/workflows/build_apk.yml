name: Build PrinterShare USB APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Download & Extract Source Code (if zipped)
        run: |
          if [ -f "*.zip" ]; then
            unzip -o *.zip
          fi

      - name: Compile and Build APK
        run: |
          if [ ! -f "build.gradle" ] && [ ! -f "app/build.gradle" ]; then
            echo "Creating minimal wrapper structure..."
            mkdir -p app/src/main/java/com/example/printershareusb app/src/main/res/values app/src/main/res/drawable app/src/main/res/xml
            
            # settings.gradle
            echo "rootProject.name='PrinterShare_USB_Edition'" > settings.gradle
            echo "include ':app'" >> settings.gradle

            # build.gradle
            echo "plugins { id 'com.android.application' version '8.2.0' apply false; id 'org.jetbrains.kotlin.android' version '1.9.20' apply false }" > build.gradle

            # app/build.gradle
            cat << 'EOF' > app/build.gradle
            plugins {
                id 'com.android.application'
                id 'org.jetbrains.kotlin.android'
            }
            android {
                namespace 'com.example.printershareusb'
                compileSdk 34
                defaultConfig {
                    applicationId 'com.example.printershareusb'
                    minSdk 24
                    targetSdk 34
                    versionCode 10
                    versionName '10.0'
                }
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
                kotlinOptions { jvmTarget = '17' }
            }
            dependencies {
                implementation 'androidx.core:core-ktx:1.12.0'
                implementation 'androidx.appcompat:appcompat:1.6.1'
                implementation 'com.google.android.material:material:1.11.0'
                implementation 'androidx.print:print:1.0.0'
            }
            EOF

            # AndroidManifest.xml
            cat << 'EOF' > app/src/main/AndroidManifest.xml
            <?xml version="1.0" encoding="utf-8"?>
            <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                <uses-feature android:name="android.hardware.usb.host" android:required="true" />
                <uses-permission android:name="android.permission.INTERNET" />
                <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
                <application
                    android:allowBackup="true"
                    android:label="PrinterShare USB Edition"
                    android:icon="@android:ic_menu_manage"
                    android:roundIcon="@android:ic_menu_manage"
                    android:usesCleartextTraffic="true"
                    android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                    <activity android:name=".MainActivity" android:exported="true">
                        <intent-filter>
                            <action android:name="android.intent.action.MAIN" />
                            <category android:name="android.intent.category.LAUNCHER" />
                        </intent-filter>
                    </activity>
                </application>
            </manifest>
            EOF

            # MainActivity.kt
            cat << 'EOF' > app/src/main/java/com/example/printershareusb/MainActivity.kt
            package com.example.printershareusb
            import android.os.Bundle
            import android.widget.TextView
            import androidx.appcompat.app.AppCompatActivity

            class MainActivity : AppCompatActivity() {
                override fun onCreate(savedInstanceState: Bundle?) {
                    super.onCreate(savedInstanceState)
                    val tv = TextView(this).apply {
                        text = "PrinterShare USB Edition\\nHP Ink Tank 319 Ready!"
                        textSize = 22f
                        setPadding(50, 100, 50, 50)
                    }
                    setContentView(tv)
                }
            }
            EOF
          fi

          # Build
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk PrinterShare_USB_Edition.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrinterShare_USB_Edition
          path: PrinterShare_USB_Edition.apk
